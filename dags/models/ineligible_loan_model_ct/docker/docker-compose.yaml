services:
  ineligible_loan_model_pipeline_ct:
    build:
      context: ../../..
      dockerfile: models/ineligible_loan_model_ct/docker/Dockerfile
    image: ineligible_loan_model:pipeline-ct-latest
    container_name: ineligible_loan_model_pipeline_ct
    env_file:
      - .env
    volumes:
      - mlops-study-ml-pipeline-init_mlops_data_store:/home/mlops/mlops_data_store
      - ../../../support:/home/mlops/support
      - ../data_preparation:/home/mlops/data_preparation
    environment:
      PYTHONPATH: /home/mlops
      MLOPS_DATA_STORE: /home/mlops/mlops_data_store
      MODEL_OUTPUT_HOME: /home/mlops
      FEATURE_STORE_URL: mysql://root:root@mariadb/mlops
    command: >
      uv run python ${PYTHON_FILE} ${MODEL_NAME} ${BASE_DAY}
    networks:
      - mlops_study_network
networks:
  mlops_study_network:
    name: mlops_study_network
    external: true
volumes:
  mlops-study-ml-pipeline-init_mlops_data_store:
    external: true
