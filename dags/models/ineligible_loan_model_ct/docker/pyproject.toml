[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-study-ml-pipeline-init"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.9"
dependencies = [
    "pandas==2.0.3",
    "kubernetes==26.1.0",
    "pymysql==1.1.0",
    "scikit-learn==1.2.2",
    "joblib==1.3.2",
    "numpy==1.23.5",
    "pendulum>=3.1.0",
    "apache-airflow>=3.0.4",
    "apache-airflow-providers-mysql>=6.3.3",
]

[tool.setuptools.packages.find]
include = ["dags*", "tests*"]

[tool.ruff]
ignore = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
